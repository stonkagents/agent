syntax = "proto3";
package AgentNet.v1;

option go_package = "github.com/stonkagents/agent/pkg/manifest";

import "google/protobuf/timestamp.proto";

message AtRawManifest {
  string filename = 1;
  string mime_type = 2;
  int64 size = 3;
  string cid = 4;
  bytes signature = 5;
  google.protobuf.Timestamp created_at = 6;
  string format_version = 7;  // e.g., "1.0"
}

message AtVecManifest {
  int32 dimensions = 1;
  string model = 2;
  string framework = 3;
  string format_version = 4;
  string cid = 5;
  bytes signature = 6;
  google.protobuf.Timestamp created_at = 7;
  string description = 8;
}
