name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: gofmt
        run: |
          out="$(gofmt -l ./cmd ./internal ./pkg ./tracker ./installer)"
          if [ -n "$out" ]; then echo "$out"; echo "run gofmt -w on the files above"; exit 1; fi
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test -short -count=1 -timeout 15m ./...
